<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel La Bomba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f2;--surface:transparent;--ink:#171212;--mute:#5f574d;--line:#d8d0c2;--acc:#B81622;--on-acc:#fff;--up:#171212;--down:#B81622;--hair:#171212;--amber:#F3A62C;--cat:#171212;--ok:#1F7A4D;--warn:#B8740A;--bad:#B81622}
[data-c=ventas]{--cat:#1F6B4A}
[data-c=visitas]{--cat:#1B6B7A}
[data-c=redes]{--cat:#7A3F78}
[data-c=sistema]{--cat:#51657A}
[data-c=ped]{--cat:#B8740A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.45 Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-feature-settings:"tnum" 1}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 72px}
.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:26px}
.who{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:14px}
.av{width:34px;height:34px;border-radius:50%;border:1px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-weight:600;font-size:14px;background:transparent}
button{font:inherit;cursor:pointer;border:0;color:var(--ink);background:none}
.out{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;letter-spacing:.04em}
.out:hover{border-color:var(--ink)}
.tabs{display:flex;gap:26px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.tabs button{padding:0 0 14px;font-weight:400;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc);border-bottom-width:2px}
.hero{background:transparent;color:#171212;border-top:1px solid var(--hair);padding:26px 0 8px;margin-bottom:26px;position:relative}
.hero::before{content:'';position:absolute;left:0;top:-1px;width:64px;height:4px;background:var(--cat)}
.hero .lbl{color:#171212;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.hero .num{font-size:clamp(52px,14vw,88px);font-weight:200;letter-spacing:-.04em;line-height:1;margin:14px 0 14px}
.delta{display:inline-block;font-size:13px;font-weight:400}
.delta.up,.delta.down{color:#171212;font-weight:600}
.hero>svg{display:block;width:100%;margin:14px 0 0;height:84px}
.list{margin-bottom:22px}
.list h2{font-size:12px;color:var(--mute);font-weight:400;margin:0 0 4px;text-transform:uppercase;letter-spacing:.16em;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--acc);display:grid;place-items:center;font-weight:400;font-size:13px;color:var(--acc);flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:400}
.rt span{color:var(--mute);font-size:13px}
.rt b,.rt span{white-space:nowrap}
.rv{text-align:right}
.rv b{display:block;font-size:22px;font-weight:300;letter-spacing:-.02em}
.spark{width:72px;height:26px;flex:none}
@media (max-width:440px){.spark{display:none}}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{max-width:360px;width:100%;text-align:center}
.login .av{width:56px;height:56px;font-size:22px;margin:0 auto 22px}
.login h1{font-size:34px;font-weight:300;letter-spacing:-.025em;margin:0 0 8px}
.login p{color:var(--mute);margin:0 0 28px}
.cta{border:1px solid var(--ink);width:100%;padding:16px;border-radius:999px;font-weight:400;letter-spacing:.06em;font-size:15px}
.cta:hover{background:var(--ink);color:var(--bg)}
.err{color:var(--down);margin-top:14px;min-height:1.4em}
[hidden]{display:none!important}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

.wrap{max-width:1040px}
.g{display:grid;gap:26px;grid-template-columns:1fr;margin-bottom:26px}
@media(min-width:860px){.g.c2{grid-template-columns:1fr 1fr;gap:40px}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--line);margin-bottom:34px}
@media(min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:18px 16px 18px 0;border-bottom:1px solid var(--line)}
.kpi:nth-child(odd){border-right:1px solid var(--line);padding-right:16px}
.kpi:nth-child(even){padding-left:18px}
@media(min-width:860px){.kpi{border-bottom:0;padding:22px 20px;border-right:1px solid var(--line)}.kpi:nth-child(odd){padding-right:20px}.kpi:nth-child(even){padding-left:20px}.kpi:first-child{padding-left:0}.kpi:last-child{border-right:0}}
.kpi .l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font-size:32px;font-weight:200;letter-spacing:-.03em;line-height:1.1;margin:8px 0 2px}
.kpi .s{font-size:13px;color:var(--mute)}
.blk h2::before,.kpi .l::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cat);margin-right:10px;vertical-align:1px}
.st{white-space:nowrap}.st::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:1px}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}
.hero .lbl::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cat);margin-right:10px;vertical-align:1px}
.tb th:first-child{color:var(--mute)}
.blk h2{font-size:12px;color:var(--mute);font-weight:400;margin:0 0 4px;text-transform:uppercase;letter-spacing:.16em;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.br{padding:12px 0 10px;border-bottom:1px solid var(--line)}
.br .t{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.br .t b{font-weight:400}
.br .t i{font-style:normal;font-variant-numeric:tabular-nums}
.br .s2{font-size:12px;color:var(--mute)}
.br .tr{height:3px;background:var(--line);margin-top:9px;position:relative}
.br .tr u{position:absolute;left:0;top:0;bottom:0;background:var(--cat);display:block}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:right;padding:10px 0;border-bottom:1px solid var(--line)}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:14px 0;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tb td:first-child{font-weight:400}
.col{display:flex;align-items:flex-end;justify-content:space-between;height:110px;margin:14px 0 6px;border-bottom:1px solid var(--hair)}
.col div{width:3px;flex:none;background:var(--cat);min-height:2px}
.col.w div{width:6px}
.ax{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);letter-spacing:.08em}
.split{display:flex;height:3px;margin:12px 0 8px;background:var(--line)}
.split u{display:block;background:var(--cat)}
.note{font-size:12px;color:var(--mute);margin:10px 0 0}

[data-c] .blk,.blk[data-c]{background:color-mix(in srgb,var(--cat) 6%,transparent);border:1px solid color-mix(in srgb,var(--cat) 38%,transparent);border-top:3px solid var(--cat);padding:16px 18px 14px;border-radius:2px}
[data-c] .blk h2,.blk[data-c] h2{border-bottom-color:color-mix(in srgb,var(--cat) 38%,transparent)}
[data-c] .br,[data-c] .tb th,[data-c] .tb td{border-bottom-color:color-mix(in srgb,var(--cat) 24%,transparent)}
.kpi[data-c]:not([data-c='']){background:color-mix(in srgb,var(--cat) 7%,transparent)}
.kpis .kpi[data-c]{padding-left:18px!important;padding-right:18px!important}
.g[data-c]>.blk+.blk{margin-top:0}
@media(max-width:859px){.g[data-c].c2{gap:18px}}

html{background:#f6f1e8}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 420px at 10% 8%,rgba(27,107,122,.40),transparent 70%),radial-gradient(480px 420px at 92% 30%,rgba(122,63,120,.30),transparent 70%),radial-gradient(560px 460px at 14% 70%,rgba(31,107,74,.30),transparent 70%),radial-gradient(520px 440px at 88% 92%,rgba(184,116,10,.34),transparent 70%)}
[data-c] .blk,.blk[data-c],.kpi[data-c]:not([data-c='']){background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.22));-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.8);box-shadow:0 1px 0 rgba(255,255,255,.85) inset,0 10px 30px -14px color-mix(in srgb,var(--cat) 45%,transparent);border-radius:14px;position:relative}
[data-c] .blk::before,.blk[data-c]::before{content:'';position:absolute;left:18px;right:18px;top:0;height:2px;background:var(--cat);opacity:.85;border-radius:0 0 2px 2px}
.kpis{border-top:0;border-bottom:0;gap:12px;margin-bottom:26px}
.kpis .kpi{border:1px solid rgba(255,255,255,.8)!important;border-radius:14px;padding:16px 18px!important}
.out{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.85)}
.hero{border-top:0}
@media(max-width:859px){.kpis{gap:10px}}
@media(max-width:559px){[data-c] .blk,.blk[data-c]{padding:14px 12px 12px}.tb{font-size:12px}.tb th{font-size:9.5px;letter-spacing:.03em}.tb td{padding:12px 0}.tb th,.tb td{padding-left:4px}.tb th:first-child,.tb td:first-child{padding-left:0}.st::before{margin-right:4px}}

[data-c=banco]{--cat:#2D5FA0}
.dayl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.dayl b{font-weight:600;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;letter-spacing:.04em;color:var(--mute)}
.chips button[aria-pressed=true]{border-color:var(--cat);color:var(--ink);font-weight:600}
.tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--cat);color:var(--cat);padding:1px 6px;border-radius:999px;margin-left:8px;white-space:nowrap}
.tag.lo{border-color:var(--bad);color:var(--bad)}
.tag.par{border-color:var(--mute);color:var(--mute)}
.tb td small{display:block;color:var(--mute);font-size:11px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{min-width:0}
@media(min-width:860px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:559px){.kpi .v{font-size:20px;letter-spacing:-.02em;white-space:nowrap}.kpi .l{font-size:11px;letter-spacing:.1em}.kpi .s{font-size:12px}.hero .num{font-size:clamp(44px,12.5vw,88px)}}

.ch{display:flex;gap:8px;margin:16px 0 0}
.yl{position:relative;width:48px;flex:none;height:150px;font-size:10px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.yl span{position:absolute;right:0;transform:translateY(50%);white-space:nowrap}
.pl{position:relative;flex:1;min-width:0;height:150px;border-left:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.gl{position:absolute;left:0;right:0;height:1px;background:color-mix(in srgb,var(--cat) 22%,transparent)}
.bs{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;gap:1px}
.bs div{flex:1;position:relative;background:var(--cat);min-height:1px}
.bs.g2{gap:6px;padding:0 4px}
.bs div i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--ink);white-space:nowrap;padding-bottom:2px}
.pl svg{position:absolute;inset:0;width:100%;height:100%}
.xl{position:relative;height:16px;margin:5px 0 4px 56px;font-size:10px;color:var(--mute)}
.xl span{position:absolute;white-space:nowrap}
.mes{font-size:38px;font-weight:200;letter-spacing:-.03em;margin:0 0 14px;text-transform:capitalize;line-height:1.1}
.mes small{font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;text-transform:none;margin-left:6px}
@media(max-width:559px){.yl{width:42px}.xl{margin-left:50px}.bs div i{font-size:9px}}
.mg{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:860px){.mg{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px;align-items:start}}
@media(max-width:859px){.mg .c{order:-1}}
.pm{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--ink);opacity:.6;z-index:2}
.bs div.pa{background:color-mix(in srgb,var(--cat) 38%,transparent);outline:1px dashed var(--cat);outline-offset:-1px}
.lg{font-size:12px;color:var(--mute);margin:6px 0 0}
.lg b{display:inline-block;width:18px;height:0;border-top:2px solid var(--cat);vertical-align:middle;margin:0 6px 0 0}
.lg b.f{border-top-width:1px;opacity:.5}
.alerta{border:1px solid #B81622;border-left-width:3px;border-radius:10px;padding:12px 16px;margin:4px 0 18px;background:#fff;display:grid;gap:4px;font-size:13px;color:#4a3f3f}.alerta b{color:#B81622;font-weight:700;font-size:14px}.hm{overflow-x:auto}.hm table{border-collapse:separate;border-spacing:3px;width:100%;font-size:12px}.hm th{font-weight:500;color:#4a3f3f;text-align:left;white-space:nowrap;padding:2px 6px}.hm td{text-align:center;border-radius:6px;height:30px;min-width:30px;color:#171212;font-variant-numeric:tabular-nums}@media(max-width:600px){.tabs{gap:18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;white-space:nowrap;font-size:12.5px;letter-spacing:.1em}}</style>
</head>
<body>

<div id="login" class="center" hidden>
  <div class="login">
    <div class="av">B</div>
    <h1>Panel La Bomba</h1>
    <p>Acceso privado.</p>
    <button class="cta" id="btnLogin">Entrar con Microsoft</button>
    <div class="err" id="err" role="alert"></div>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <div class="top">
    <div class="who"><div class="av" id="ini">B</div><span id="quien"></span></div>
    <button class="out" id="btnSalir">Salir</button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="ingresos">Ingresos digitales</button>
    <button role="tab" aria-selected="false" data-tab="pedidos">Pedidos web</button>
    <button role="tab" aria-selected="false" data-tab="paginas">Páginas</button>
    <button role="tab" aria-selected="false" data-tab="redes">Redes sociales</button>
  </div>
  <section id="tab-ingresos"></section>
  <section id="tab-pedidos" hidden></section>
  <section id="tab-paginas" hidden></section>
  <section id="tab-redes" hidden></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://dwlbcbtwdungyrykgahm.supabase.co';
const SUPA_KEY='sb_publishable_gUoYvCNka0je2rbNeWPpUA_l26vgQbO'; // clave pública; el acceso real lo controla RLS
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>new Intl.NumberFormat('es-CR').format(Math.round(n));
const crc=n=>'₡'+fmt(n);
const pct=(a,b)=>b?Math.round(a/b*100)+' %':'—';
const NEG={soda:'Soda La Bomba',pollos:'Pollos La Bomba',papea:'Papea'};
let R=[];

/* ---- datos ---- */
const rows=(o)=>R.filter(r=>(!o.fuente||r.fuente===o.fuente)&&(!o.metrica||r.metrica===o.metrica)&&(o.sitio===undefined||r.sitio===o.sitio)&&(o.detalle===undefined||r.detalle===o.detalle));
const sum=o=>rows(o).reduce((a,r)=>a+Number(r.valor),0);
const dias=()=>[...new Set(R.map(r=>r.fecha))].sort();
const serie=o=>{const m={};rows(o).forEach(r=>m[r.fecha]=(m[r.fecha]||0)+Number(r.valor));return dias().map(d=>m[d]||0);};
const avg=o=>{const a=rows(o);return a.length?a.reduce((x,r)=>x+Number(r.valor),0)/a.length:0;};
const last=o=>{const a=rows(o).sort((x,y)=>x.fecha<y.fecha?-1:1);return a.length?Number(a[a.length-1].valor):0;};
const first=o=>{const a=rows(o).sort((x,y)=>x.fecha<y.fecha?-1:1);return a.length?Number(a[0].valor):0;};
const groups=o=>{const m={};rows(o).forEach(r=>m[r.detalle]=(m[r.detalle]||0)+Number(r.valor));return Object.entries(m).sort((a,b)=>b[1]-a[1]);};

/* ---- piezas ---- */
function path(v,w,h,p){const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;return v.map((x,i)=>[i*(w/(v.length-1)),h-p-((x-mn)/r)*(h-p*2)]);}
function area(v){if(v.length<2)return'';const w=300,h=96,p=path(v,w,h,10);const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="#171212" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;}
function delta(v){if(v.length<8)return'';const a=v.slice(-7).reduce((x,y)=>x+y,0),b=v.slice(0,-7).reduce((x,y)=>x+y,0);if(!b)return'';const d=(a-b)/b*100;return `<span class="delta">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(0)} % vs semana anterior</span>`;}
const C=(c,x)=>`<div data-c="${c}">${x}</div>`;
const stt=(v,t)=>`<span class="st ${v>=99.5?'ok':v>=99?'warn':'bad'}">${t}</span>`;
const hero=(l,n,v,f,ds)=>`<div class="hero"><div class="lbl">${l}</div><div class="num">${n}</div>${delta(v)}${ds?lineAx(v,dlabs(ds),f||fmt):area(v)}</div>`;
const kpis=a=>`<div class="kpis">${a.map(k=>`<div class="kpi" data-c="${k.c||''}"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="s">${k.s||''}</div></div>`).join('')}</div>`;
function bars(titulo,items,f=fmt,max,sub){
  max=max||Math.max(...items.map(i=>i[1]),1);
  return `<div class="blk"><h2>${titulo}</h2>${items.map(i=>`<div class="br"><div class="t"><b>${esc(i[0])}</b><i>${f(i[1])}</i></div>${i[2]?`<div class="s2">${esc(i[2])}</div>`:''}<div class="tr"><u style="width:${Math.max(1.5,i[1]/max*100)}%"></u></div></div>`).join('')}${sub?`<p class="note">${sub}</p>`:''}</div>`;
}
const cc=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' M':a>=1e3?Math.round(n/1e3)+' mil':String(Math.round(n));};
function ticks(lo,hi,ent){const r=(hi-lo)||1,raw=r/4,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=Math.max(ent?1:0,(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p),a=Math.floor(lo/st+1e-9)*st,b=Math.ceil(hi/st-1e-9)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(v);return t;}
function xlab(labels,n,bars){return labels.map((l,i)=>{if(!l)return'';const k=labels.length,pos=k===n?(i+.5)/n:i/(k-1),tr=pos<.04?'0':pos>.96?'-100%':'-50%';return `<span style="left:${(pos*100).toFixed(2)}%;transform:translateX(${tr})">${l}</span>`;}).join('');}
function axes(plot,t,lo,hi,f,labels,n){const R=(hi-lo)||1;return `<div class="ch"><div class="yl">${t.map(v=>`<span style="bottom:${((v-lo)/R*100).toFixed(2)}%">${f(v)}</span>`).join('')}</div><div class="pl">${t.map(v=>`<div class="gl" style="bottom:${((v-lo)/R*100).toFixed(2)}%"></div>`).join('')}${plot}</div></div><div class="xl">${xlab(labels,n)}</div>`;}

  h+=`<div class="g c2">${C('ventas',bars('Más pedidos',top(uP),fmt,null,'Unidades. Las bebidas salen con el nombre de Prisma.'))}${C('ventas',bars('Los que más venden',top(mP),v=>'₡'+cc(v),null,'Monto bruto por producto, con los precios conocidos.'))}</div>`;
  const tasa=Object.keys({...uP,...uA}).map(n=>[n,(uA[n]||0)/((uA[n]||0)+(uP[n]||0)),(uA[n]||0)+(uP[n]||0)]).filter(x=>x[2]>=3).sort((a,b)=>b[1]-a[1]).slice(0,10);
  h+=`<div class="g c2">${C('ped',bars('Más dejados en carritos abandonados',top(uA),fmt,null,'Unidades que se quedaron sin enviar.'))}${C('ped',bars('Tasa de abandono por producto',tasa.map(x=>[x[0],Math.round(x[1]*100),fmt(x[2])+' unidades en total']),v=>v+' %',100,'Solo productos con 3 unidades o más. Una tasa alta puede indicar precio, opciones confusas o falta de foto.'))}</div>`;
  // combinaciones
  const par={};P.forEach(p=>{const s=[...new Set((p.items||[]).map(prodNombre).filter(Boolean))].sort();for(let a=0;a<s.length;a++)for(let b=a+1;b<s.length;b++){const k=s[a]+' + '+s[b];par[k]=(par[k]||0)+1;}});
  const pares=Object.entries(par).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const abP=RANGOS.map(r=>{const k=K.filter(c=>(c.enviado||aband(c))&&Number(c.total)>=r[0]&&Number(c.total)<r[1]);return k.length?Math.round(k.filter(aband).length/k.length*100):0;});
  h+=`<div class="g c2">${C('ventas',pares.length?bars('Combinaciones frecuentes',pares.map(x=>[x[0],x[1],pct(x[1],P.length)+' de los pedidos']),v=>fmt(v)+' ped.',null,'Productos que se piden juntos. Sirve para armar combos y sugerencias.'):'<div class="blk"><h2>Combinaciones frecuentes</h2><p class="note">Todavía no hay pedidos con dos productos distintos.</p></div>')}${C('ped',cols('Abandono según el valor del carrito',abP,['<1,5k','1,5–3k','3–5k','5–10k','10–20k','20k+'],'Eje vertical: % de carritos de ese rango que no se enviaron. Eje horizontal: valor del carrito en colones. Si sube con el valor, el precio frena la compra.',1,v=>v+' %'))}</div>`;
  // clientes
  const tel={};P.forEach(p=>{const t=(p.cliente_telefono||'').replace(/\D/g,'');if(t)(tel[t]=tel[t]||[]).push(new Date(p.creado_en).getTime());});
  const cl=Object.values(tel),rep=cl.filter(a=>a.length>1),gaps=rep.flatMap(a=>a.sort((x,y)=>x-y).slice(1).map((v,i)=>(v-a[i])/864e5));
  h+=kpis([{c:'redes',l:'Clientes distintos',v:fmt(cl.length),s:'teléfonos en 30 días'},{c:'redes',l:'Clientes que repiten',v:fmt(rep.length),s:pct(rep.length,cl.length)+' de los clientes'},{c:'redes',l:'Días entre pedidos',v:gaps.length?(gaps.reduce((a,b)=>a+b,0)/gaps.length).toFixed(1).replace('.',','):'—',s:'promedio de los que repiten'},{c:'redes',l:'Pedidos por cliente',v:cl.length?(P.length/cl.length).toFixed(2).replace('.',','):'—',s:'en 30 días'}]);
  h+=`<p class="note">Montos brutos, sin costo de envío. Un carrito cuenta como abandonado si pasa más de 30 minutos sin enviarse. Los teléfonos solo se cuentan; el panel no muestra datos personales. Cruces que vienen: pedidos web frente a ingresos por SINPE y tarjeta del mismo día, y conversión por origen de la visita.</p>`;
  $('tab-pedidos').innerHTML=h;
}

/* ---- Páginas: quién llega, de dónde y qué hace ---- */
const INTENCION=[
  ['Pedir: abrir el menú o una categoría',p=>/^(soda|pollos)-menu|^chip-|menu-a-pedido/.test(p)],
  ['Escribir por WhatsApp',p=>/-wa$/.test(p)],
  ['Cómo llegar: Maps o Waze',p=>/^info-(maps|waze)$/.test(p)],
  ['Ver la zona de entrega',p=>p==='zona-entrega'],
  ['Dejar o leer reseñas',p=>/resena|^red-g$/.test(p)],
  ['Ir a redes sociales',p=>/^red-(ig|fb)$|nosotros-(instagram|facebook)/.test(p)],
  ['Pasar a otro negocio',p=>/^(sites|fam|cross)-|hero-papea|pollos-a-papea/.test(p)],
  ['Ver información',p=>p==='bbar-info'],
  ['Inscribirse a novedades',p=>p==='novedades-enviado']];
const PAG={'/':'Inicio','/nosotros':'Nosotros','/pollos/':'Menú de Pollos','/papea/':'Papea','/privacidad':'Privacidad'};
function pintarPag(){
  const g=o=>groups(Object.assign({fuente:'goatcounter'},o));
  const fv=rows({fuente:'goatcounter',metrica:'visitas'}).map(r=>r.fecha).sort().pop();
  const ds=[...new Set(rows({fuente:'goatcounter',metrica:'visitas'}).map(r=>r.fecha))].sort(),visT=sum({fuente:'goatcounter',metrica:'visitas'});
  const dv=(s,f)=>rows({fuente:'goatcounter',metrica:'visitas',sitio:s}).filter(r=>r.fecha===f).reduce((a,r)=>a+Number(r.valor),0);
  const dev=g({metrica:'dispositivo'}),devT=dev.reduce((a,x)=>a+x[1],0),cel=(dev.find(x=>x[0]==='Celular')||[0,0])[1];
  const ORG={ig:'Instagram',fb:'Facebook',l:'Facebook'};
  const og=Object.entries(g({metrica:'origen'}).reduce((m,[k,v])=>{const n=ORG[k]||k;m[n]=(m[n]||0)+v;return m},{})).sort((a,b)=>b[1]-a[1]),ogT=og.reduce((a,x)=>a+x[1],0);
  let h=fv?`<div class="dayl">Último día con datos · <b>${fl(fv)}</b></div>`+kpis([{c:'visitas',l:'Visitas',v:fmt(dv('soda',fv)+dv('pollos',fv)),s:'Soda '+fmt(dv('soda',fv))+' · Pollos y Papea '+fmt(dv('pollos',fv))},{c:'visitas',l:'Desde el celular',v:pct(cel,devT),s:'de las visitas de 14 días'},{c:'visitas',l:'Llegan más desde',v:og[0]?og[0][0]:'—',s:og[0]?pct(og[0][1],ogT)+' de las llegadas':''},{c:'visitas',l:'Visitas en 14 días',v:fmt(visT),s:fmt(visT/Math.max(ds.length,1))+' por día'}]):'';
  h+=`<div class="dayl">Últimos 14 días</div><div class="g" data-c="visitas">${cols('Visitas por día',ds.map(d=>dv('soda',d)+dv('pollos',d)),dlabs(ds),'Eje vertical: visitas a las dos páginas. Eje horizontal: fecha, de la más antigua a la más reciente.',1,fmt)}</div>`;
  // intención
  const cl=g({metrica:'clic'}),it=INTENCION.map(([n,f])=>[n,cl.filter(([p])=>f(p)).reduce((a,x)=>a+x[1],0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  h+=`<div class="g c2" data-c="visitas">${bars('Qué hacen al llegar',it.map(x=>[x[0],x[1],pct(x[1],visT)+' de las visitas']),fmt,null,'Toques en botones, agrupados por intención.')}${bars('De dónde llegan',og,v=>pct(v,ogT))}</div>`;
  h+=`<div class="g c2" data-c="visitas">${bars('Dispositivos',dev,v=>pct(v,devT))}${table('Por negocio',['Negocio','Visitas','Pedir','WhatsApp','Cómo llegar'],['soda','pollos'].map(s=>{const c=g({metrica:'clic',sitio:s}),vv=sum({fuente:'goatcounter',metrica:'visitas',sitio:s}),q=f=>pct(c.filter(([p])=>f(p)).reduce((a,x)=>a+x[1],0),vv);return [s==='soda'?NEG.soda:'Pollos y Papea',fmt(vv),q(INTENCION[0][1]),q(INTENCION[1][1]),q(INTENCION[2][1])];}))}</div>`;
  // menú
  const CH=['Desayunos y gallos','Casados y platos fuertes','Extras','Antojitos','Pollo','Hamburguesas','Pizzas','Combos y baldes','Bebidas y postres'];
  const cat=cl.filter(([p])=>p.startsWith('chip-')).map(([p,v])=>{const k=p.slice(5);return [/^\d+$/.test(k)?(CH[+k]||k)+' (Soda)':k.replace(/-/g,' ')+' (Pollos)',v];});
  const ab={},ag={};cl.forEach(([p,v])=>{if(p.startsWith('p-abrir/'))ab[p.slice(8)]=(ab[p.slice(8)]||0)+v;if(p.startsWith('p-agregar/'))ag[p.slice(10)]=(ag[p.slice(10)]||0)+v;});
  const nom=s=>s.replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
  const pa=Object.keys(ab).map(k=>[nom(k),ab[k],ag[k]||0]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const bus=cl.filter(([p])=>p.startsWith('buscar/')).map(([p,v])=>[p.slice(7).replace(/-/g,' '),v]).slice(0,10),sin=cl.filter(([p])=>p.startsWith('buscar-sin/')).map(([p,v])=>[p.slice(11).replace(/-/g,' '),v]).slice(0,10);
  const sv=t=>(cl.find(([p])=>p===t)||[0,0])[1];
  h+=`<div class="dayl" style="margin-top:34px">El menú por dentro</div><div class="g c2" data-c="visitas">${cat.length?bars('Categorías más abiertas',cat.slice(0,10)):'<div class="blk"><h2>Categorías más abiertas</h2><p class="note">Sin datos todavía.</p></div>'}${pa.length?table('Productos abiertos y agregados',['Producto','Abiertos','Agregados','% agregado'],pa.map(x=>[x[0],fmt(x[1]),fmt(x[2]),pct(x[2],x[1])])):'<div class="blk"><h2>Productos abiertos y agregados</h2><p class="note">Empieza a contar cuando la página nueva reemplace a la publicada.</p></div>'}</div>`;
  h+=`<div class="g c2" data-c="visitas">${bus.length?bars('Lo que más buscan',bus):'<div class="blk"><h2>Lo que más buscan</h2><p class="note">Sin datos todavía.</p></div>'}${sin.length?bars('Buscaron y no encontraron',sin,fmt,null,'Productos que la gente espera y no ve en el menú.'):'<div class="blk"><h2>Buscaron y no encontraron</h2><p class="note">Sin datos todavía.</p></div>'}</div>`;
  const sg=[['Bebida grande','sug-bebida-grande'],['Bebida','sug-bebida'],['Papea','sug-papea']].map(([n,t])=>[n,sv(t+'-visto'),sv(t),sv(t+'-agregada')]).filter(x=>x[1]||x[2]);
  if(sg.length)h+=`<div class="g" data-c="visitas">${table('Sugerencias del carrito',['Sugerencia','Vistas','Tocadas','Agregadas','% agregadas'],sg.map(x=>[x[0],fmt(x[1]),fmt(x[2]),fmt(x[3]),pct(x[3],x[1])]))}</div>`;
  const pg=['soda','pollos'].flatMap(s=>g({metrica:'pagina',sitio:s}).map(([p,v])=>[(PAG[p]||p)+(s==='soda'?' de la Soda':' de Pollos'),v])).sort((a,b)=>b[1]-a[1]).slice(0,8);
  h+=`<div class="g" data-c="visitas">${bars('Páginas más vistas',pg)}</div>`;
  h+=`<p class="note">Datos anónimos de GoatCounter, sin datos personales. Las páginas de prueba no se cuentan: los eventos nuevos del menú (productos, búsquedas, zona de entrega y sugerencias) empiezan a sumar cuando la página nueva reemplace a la publicada.</p>`;
  $('tab-paginas').innerHTML=h;
}

async function traer(){
  const desde=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  let all=[],from=0;
  for(;;){
    const {data,error}=await sb.from('panel_metricas').select('fecha,fuente,sitio,metrica,detalle,valor').gte('fecha',desde).order('fecha').range(from,from+999);
    if(error) throw error;
    all=all.concat(data); if(data.length<1000) break; from+=1000;
  }
  return all;
}
async function traerBcr(){
  let all=[],from=0;
  for(;;){
    const {data,error}=await sb.from('panel_metricas').select('fecha,metrica,detalle,valor').eq('fuente','bcr').order('fecha').range(from,from+999);
    if(error) throw error;
    all=all.concat(data); if(data.length<1000) break; from+=1000;
  }
  return all;
}
async function cargar(){
  try{M=await traerMeta();}catch(e){M=[];}
  pintarRedes();
  try{armarB(await traerBcr());pintarIng();}
  catch(e){$('tab-ingresos').innerHTML='<div class="blk"><h2>No se pudieron cargar los ingresos</h2></div>';}
  try{R=await traer();}catch(e){R=[];}
  try{pintarPed(await traerTabla('pedidos','creado_en,sitio,items,total,direccion,cliente_telefono'),await traerTabla('carritos','creado_en,actualizado_en,sitio,items,total,enviado'));}
  catch(e){$('tab-pedidos').innerHTML='<div class="blk"><h2>No se pudieron cargar los pedidos</h2></div>';}
  try{pintarPag();}catch(e){$('tab-paginas').innerHTML='<div class="blk"><h2>No se pudieron cargar las visitas</h2></div>';}
}
async function validar(session){
  if(!session){$('app').hidden=true;$('login').hidden=false;return;}
  const {data:ok,error}=await sb.rpc('es_panel');
  if(error||ok!==true){await sb.auth.signOut();$('app').hidden=true;$('login').hidden=false;$('err').textContent='Esta cuenta no tiene acceso al panel.';return;}
  $('login').hidden=true;$('app').hidden=false;
  const em=session.user.email||'';$('quien').textContent=em;$('ini').textContent=(em[0]||'B').toUpperCase();
  cargar();
}
$('btnLogin').onclick=()=>sb.auth.signInWithOAuth({provider:'azure',options:{scopes:'email',redirectTo:location.origin+location.pathname}});
$('btnSalir').onclick=async()=>{await sb.auth.signOut();location.reload();};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['ingresos','pedidos','paginas','redes'].forEach(t=>$('tab-'+t).hidden=b.dataset.tab!==t);
});
sb.auth.getSession().then(({data})=>validar(data.session));
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')validar(null);});
</script>
